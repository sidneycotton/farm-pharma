<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm&Pharma - Colhendo Saúde</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">

    <header class="topo-app">
      <h1>Farm&amp;Pharma</h1>
      <p>Colhendo Saúde</p>
    </header>

    <main class="tela-container">

      <section id="tela-inicio" class="tela ativa">

        <section class="cartao">
          <h2>Criar Desafio</h2>
          <form id="form-desafio">
            <label for="nome-desafio">Nome do desafio</label>
            <input type="text" id="nome-desafio" placeholder="Ex: Tomar remédio da manhã" required>

            <label for="horario-desafio">Horário</label>
            <input type="time" id="horario-desafio" required>

            <button type="submit">Plantar Semente</button>
          </form>
        </section>

        <section class="cartao">
          <h2>Meus Desafios</h2>
          <ul id="lista-desafios"></ul>
        </section>

      </section>

      <section id="tela-jardim" class="tela">
        <section class="cartao">
          <h2>Meu Jardim Zen</h2>
          <div id="jardim"></div>
        </section>
        <button id="btn-reset" class="btn-reset">Resetar progresso</button>
      </section>

      <section id="tela-lembretes" class="tela">
        <section class="cartao tela-vazia">
          <h2>Lembretes</h2>
          <p>Em breve 🌱</p>
        </section>
      </section>

      <section id="tela-perfil" class="tela">
        <section class="cartao tela-vazia">
          <h2>Perfil</h2>
          <p>Em breve 🌱</p>
        </section>
      </section>

    </main>

    <nav class="nav-inferior">
      <button class="nav-btn ativo" data-tela="tela-inicio">
        <span>🏡</span>
        Início
      </button>
      <button class="nav-btn" data-tela="tela-jardim">
        <span>🌷</span>
        Jardim
      </button>
      <button class="nav-btn" data-tela="tela-lembretes">
        <span>⏰</span>
        Lembretes
      </button>
      <button class="nav-btn" data-tela="tela-perfil">
        <span>🙂</span>
        Perfil
      </button>
    </nav>

  </div>

  <script src="plantas.js"></script>
  <script src="app.js"></script>
</body>
</html>
