<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Procedural Garden</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="app">

    <!-- ===================== SIMULATOR TAB ===================== -->
    <section id="tab-simulator" class="tab-view active">
      <header>
        <h1>🌱 Procedural Garden</h1>
        <p class="subtitle">Every plant is generated from its own random seed. Click <strong>Grow</strong> to advance it through its life stages.</p>
      </header>

      <div class="stage-panel">
        <div class="stage-info">
          <span id="plantType">—</span>
          <span id="plantName" class="plant-name"></span>
          <span id="stageLabel">Stage 0 / 0</span>
        </div>

        <div class="canvas-wrap">
          <svg id="plantSvg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <div class="controls">
          <button id="growBtn" class="btn primary">🌿 Grow</button>
          <button id="newPlantBtn" class="btn secondary" disabled>🌾 Plant Next</button>
          <select id="typeSelect">
            <option value="random">Random type</option>
            <option value="tree">Tree</option>
            <option value="flower">Flower</option>
            <option value="succulent">Succulent</option>
            <option value="vine">Vine</option>
            <option value="cactus">Cactus</option>
            <option value="mushroom">Mushroom</option>
          </select>
        </div>

        <div class="seed-display">seed: <span id="seedLabel"></span></div>
      </div>

      <section class="garden-section">
        <div class="garden-header">
          <h2>Your Garden (<span id="gardenCount">0</span>)</h2>
          <button id="clearGardenBtn" class="btn text">Clear all</button>
        </div>
        <div id="gardenGrid" class="garden-grid"></div>
      </section>
    </section>

    <!-- ===================== ZEN GARDEN TAB ===================== -->
    <section id="tab-zen" class="tab-view">
      <div id="zenViewport" class="zen-viewport">
        <svg id="zenSky" class="zen-sky" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
        <div id="zenWorld" class="zen-world">
          <svg id="zenWorldSvg" class="zen-world-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
        </div>

        <!-- floating "holding a tree" placement layer -->
        <div id="placementLayer" class="placement-layer">
          <div class="placement-hint">Move it over a free spot, then tap to plant</div>
          <div id="heldPlant" class="held-plant">
            <svg id="heldPlantSvg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>

        <div class="zen-scroll-hint">← scroll →</div>
      </div>
    </section>

  </div>

  <!-- ===================== BOTTOM TAB BAR ===================== -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="simulator">
      <span class="tab-icon">🌱</span>
      <span class="tab-label">Simulator</span>
    </button>
    <button class="tab-btn" data-tab="zen">
      <span class="tab-icon">🎍</span>
      <span class="tab-label">Zen Garden</span>
    </button>
  </nav>
</div>

<script src="rng.js"></script>
<script src="plants.js"></script>
<script src="zen.js"></script>
<script src="app.js"></script>
</body>
</html>
