<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm&Pharma - Colhendo Saúde</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <h1>Farm&amp;Pharma</h1>
    <p>Colhendo Saúde</p>
  </header>

  <main class="conteudo">

    <section class="cartao">
      <h2>Criar Desafio</h2>
      <form id="form-desafio">
        <label for="nome-desafio">Nome do desafio</label>
        <input type="text" id="nome-desafio" placeholder="Ex: Tomar remédio da manhã" required>

        <label for="horario-desafio">Horário</label>
        <input type="time" id="horario-desafio" required>

        <button type="submit">Plantar Semente</button>
      </form>
    </section>

    <section class="cartao">
      <h2>Meus Desafios</h2>
      <ul id="lista-desafios"></ul>
    </section>

    <section class="cartao">
      <h2>Meu Jardim Zen</h2>
      <div id="jardim"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
